name: CI & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests on Linux
        run: python -m unittest discover -s tests -v

  build-windows:
    runs-on: windows-latest
    needs: test-linux
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --icon "assets/app.ico"
          --add-data "assets;assets"
          --name "SZU-NetSentinel-${{ github.ref_name || 'latest' }}"
          main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SZU-NetSentinel-Windows
          path: dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*.exe szu_sentinel_linux.py install_linux.sh szu-sentinel.service
          --title "SZU NetSentinel ${{ github.ref_name }}"
          --generate-notes
